name: Publish Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-container-main
  cancel-in-progress: false

jobs:
  container:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker for the multi-architecture build
        uses: docker/setup-docker-action@v5
        with:
          set-host: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/neuralmimicry/aria:sha-${{ github.sha }}
            ghcr.io/neuralmimicry/aria:latest
          labels: |
            org.opencontainers.image.source=https://github.com/neuralmimicry/aria
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aria-container
          cache-to: type=gha,scope=aria-container,mode=max

      - name: Verify published architectures
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/neuralmimicry/aria:sha-${{ github.sha }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE" |
            jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] as $architectures
              | ($architectures | index("amd64")) != null
                and ($architectures | index("arm64")) != null
            '
