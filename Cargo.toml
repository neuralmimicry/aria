[package]
name = "aria"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Automated Regulation & Integrity Arbiter for NeuralMimicry"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = "0.8"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true

